<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>03 · 显式 BindGroupLayout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1220; color: #e8eef8; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    #app { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: absolute; left: 16px; top: 16px; max-width: 440px; padding: 12px 14px; background: rgba(8,14,28,.55); border: 1px solid rgba(140,180,255,.2); border-radius: 8px; font-size: 13px; line-height: 1.55; pointer-events: none; }
    #hud a { pointer-events: auto; color: #9ec5ff; text-decoration: none; }
    #error { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; padding: 24px; text-align: center; background: #0b1220; z-index: 10; }
    #error.visible { display: flex; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="gpu-canvas"></canvas>
    <div id="hud">
      <strong>03 · 显式 BindGroupLayout</strong>
      <p>group(0) 共享 viewProj · group(1) 每立方体独立 model + color</p>
      <p style="margin-top:8px"><a href="/">← 返回选择</a></p>
    </div>
    <div id="error"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
