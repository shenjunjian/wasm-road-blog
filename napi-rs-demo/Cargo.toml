
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "napi_rs_demo"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.0.0", features = ["async"] }
napi-derive = "3.0.0"
tokio = { version = "1.52.3", features = ["sync", "macros", "io-util", "rt", "time"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
